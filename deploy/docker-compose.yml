version: '3.8'

services:
  # PostgreSQL 16 with pgvector extension for 1,000+ playbook vector search & Merkle audit
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vulcan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulcan_control_plane
      POSTGRES_USER: vulcan_admin
      POSTGRES_PASSWORD: vulcan_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulcan_admin -d vulcan_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7.2 for Redlock distributed target mutex & live stdout Pub/Sub backplane
  redis:
    image: redis:7.2-alpine
    container_name: vulcan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3 Object Storage for decoupled 10GB binary payloads
  minio:
    image: minio/minio:latest
    container_name: vulcan-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: vulcan_minio_admin
      MINIO_ROOT_PASSWORD: vulcan_minio_secret_2026
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Ephemeral MinIO Bucket Bootstrap Provisioner (INFRA-07)
  minio-init:
    image: minio/mc:latest
    container_name: vulcan-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 vulcan_minio_admin vulcan_minio_secret_2026; do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb local/vulcan-artifacts || true;
      /usr/bin/mc anonymous set download local/vulcan-artifacts || true;
      exit 0;
      "

  # Dedicated Sandbox Execution Target (Ubuntu 22.04 with OpenSSH & Python)
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: vulcan-sandbox
    restart: unless-stopped
    volumes:
      - sandbox_data:/var/lib
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/sshd -t || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Backend Control Plane
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vulcan-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vulcan_admin:vulcan_secure_password_2026@postgres:5432/vulcan_control_plane
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: vulcan_minio_admin
      S3_SECRET_KEY: vulcan_minio_secret_2026
      S3_BUCKET_NAME: vulcan-artifacts
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      SIMULATION_MODE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      sandbox:
        condition: service_healthy

  # Next.js 15 Obsidian Glass Web Console
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vulcan-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_data:
  sandbox_data:
