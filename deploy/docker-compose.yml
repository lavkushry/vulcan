version: '3.8'

services:
  # PostgreSQL 16 with pgvector extension for 1,000+ playbook vector search & Merkle audit
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vulcan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulcan_control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-vulcan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vulcan_admin} -d $${POSTGRES_DB:-vulcan_control_plane}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7.2 for Redlock distributed target mutex & live stdout Pub/Sub backplane
  redis:
    image: redis:7.2-alpine
    container_name: vulcan-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"; else exec redis-server --appendonly yes; fi"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping || exit 1; else redis-cli ping || exit 1; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3 Object Storage for decoupled 10GB binary payloads
  minio:
    image: minio/minio:latest
    container_name: vulcan-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vulcan_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Ephemeral MinIO Bucket Bootstrap Provisioner (INFRA-07)
  minio-init:
    image: minio/mc:latest
    container_name: vulcan-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-vulcan_minio_admin} $${MINIO_ROOT_PASSWORD}; do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb local/$${S3_BUCKET_NAME:-vulcan-artifacts} || true;
      /usr/bin/mc anonymous set download local/$${S3_BUCKET_NAME:-vulcan-artifacts} || true;
      exit 0;
      "

  # Dedicated Sandbox Execution Target (Ubuntu 22.04 with OpenSSH & Python)
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: vulcan-sandbox
    restart: unless-stopped
    volumes:
      - sandbox_data:/var/lib
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/sshd -t || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Backend Control Plane
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vulcan-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vulcan_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulcan_control_plane}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vulcan_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vulcan-artifacts}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      SIMULATION_MODE: "${SIMULATION_MODE:-false}"
      VULCAN_API_TOKENS: '${VULCAN_API_TOKENS}'
      VULCAN_AUTH_DISABLED: "${VULCAN_AUTH_DISABLED:-0}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      sandbox:
        condition: service_healthy

  # Next.js 15 Obsidian Glass Web Console
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_VULCAN_API_TOKEN: ${NEXT_PUBLIC_VULCAN_API_TOKEN:-}
    container_name: vulcan-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_VULCAN_API_TOKEN: ${NEXT_PUBLIC_VULCAN_API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_data:
  sandbox_data:
