services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vulcan
      POSTGRES_USER: vulcan
      POSTGRES_PASSWORD: vulcan_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulcan -d vulcan"]
    ports: ["5432:5432"]
    volumes: ["whiteboard_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: vulcan
      MINIO_ROOT_PASSWORD: vulcan_local_only
    volumes: ["whiteboard_minio:/data"]
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  sync:
    build:
      context: ..
      dockerfile: apps/sync/Dockerfile
    ports: ["8081:8081"]
    depends_on: [redis]
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on: [postgres, redis]
volumes:
  whiteboard_pg:
  whiteboard_minio:
