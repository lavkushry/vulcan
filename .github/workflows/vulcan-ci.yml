name: Project Vulcan Enterprise CI Gate

on:
  push:
    branches: [ main, dev, agentos-ultra ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: vulcan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 1: Backend Quality, Domain Invariants & Golden Evals ─────────────
  backend-gate:
    name: Backend Domain Invariants & Golden Evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vulcan_control_plane
          POSTGRES_USER: vulcan_admin
          POSTGRES_PASSWORD: vulcan_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulcan_admin -d vulcan_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Hermetic Runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx psycopg[binary]

      - name: Apply Database Migrations (Fresh PostgreSQL Schema Gate)
        env:
          DATABASE_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
        run: |
          python ../scripts/run_migrations.py --db-url "$DATABASE_URL"

      - name: Run Full PyTest Suite (Domain Invariants + Postgres Contract Tests + Golden Evals)
        env:
          VULCAN_AUTH_DISABLED: "0"
          VULCAN_API_TOKENS: '{"vlc_test_alice": "eng.alice", "vlc_test_bob": "lead.bob", "vlc_test_admin": "admin.dave", "vlc_test_sec": "sec.carol", "vlc_test_charlie": "operator.charlie"}'
          NEXT_PUBLIC_VULCAN_API_TOKEN: "vlc_test_alice"
          DATABASE_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
          POSTGRES_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
        run: |
          pytest tests/ -v --tb=short

      - name: Run Domain Governance Mutation Testing Engine (Milestone C.2 Gate)
        run: |
          python ../scripts/run_domain_mutation_tests.py

      - name: Run 500-Scenario Golden Evaluation CI Regression Gate (CHAT-20)
        run: |
          python ../scripts/run_eval.py --provider fake --gate

  # ─── Stage 2: Frontend Type Safety & Production Standalone Build ───────────
  frontend-gate:
    name: Next.js 15 Console Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npx tsc --noEmit

      - name: Production Standalone Build
        run: npm run build

  # ─── Stage 3: Platform Clean Checkout Reproducibility ──────────────────────
  reproducibility-gate:
    name: Hermetic Clean Checkout Gate (INFRA-02)
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Verify Clean Checkout Script
        run: |
          chmod +x scripts/verify-clean-checkout.sh
          ./scripts/verify-clean-checkout.sh

  # ─── Stage 4: Playwright Browser E2E Integration Gate (Milestone C.1) ───────
  e2e-gate:
    name: Playwright Browser E2E Gate (Milestone C.1)
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vulcan_control_plane
          POSTGRES_USER: vulcan_admin
          POSTGRES_PASSWORD: vulcan_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulcan_admin -d vulcan_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies & Apply Database Migrations
        env:
          DATABASE_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt psycopg[binary] pytest httpx
          python scripts/run_migrations.py --db-url "$DATABASE_URL"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright Browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Frontend Standalone
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
        run: npm run build

      - name: Start Backend & Frontend Services
        env:
          VULCAN_AUTH_DISABLED: "0"
          VULCAN_API_TOKENS: '{"vlc_test_bot_ci_token": "e2e.bot", "vlc_test_alice_ci_token": "eng.alice", "vlc_test_bob_ci_token": "lead.bob", "vlc_test_dave_ci_token": "admin.dave", "vlc_test_carol_ci_token": "sec.carol"}'
          DATABASE_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
          POSTGRES_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
        run: |
          python -m uvicorn app.api.server:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          cd frontend && npm start > /tmp/frontend.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/healthz > /dev/null && curl -s -f http://127.0.0.1:3000 > /dev/null; then
              echo "Services healthy and answering probes!"
              break
            fi
            echo "Waiting for services to respond... ($i/30)"
            sleep 1
          done

          if ! curl -s -f http://127.0.0.1:8000/healthz > /dev/null || ! curl -s -f http://127.0.0.1:3000 > /dev/null; then
            echo "🔴 FATAL: Services failed to start within 30s"
            echo "=== Backend Log ==="
            cat /tmp/backend.log || true
            echo "=== Frontend Log ==="
            cat /tmp/frontend.log || true
            exit 1
          fi

      - name: Run Playwright E2E Test Suite
        working-directory: frontend
        env:
          E2E_BOT_TOKEN: "vlc_test_bot_ci_token"
          E2E_ALICE_TOKEN: "vlc_test_alice_ci_token"
          E2E_BOB_TOKEN: "vlc_test_bob_ci_token"
          E2E_DAVE_TOKEN: "vlc_test_dave_ci_token"
          E2E_CAROL_TOKEN: "vlc_test_carol_ci_token"
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
        run: npx playwright test

      - name: Upload E2E Test Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-evidence
          path: |
            docs/e2e/evidence/
            docs/e2e/report/
          retention-days: 14

  # ─── Stage 5: Supply Chain Security & SBOM Gate (INFRA-30) ──────────────────
  sbom-gate:
    name: Supply Chain Security & SBOM Gate (INFRA-30)
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python Dependencies for SBOM Introspection
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Syft & Trivy CLI Tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          syft --version
          trivy --version

      - name: Generate Standards-Compliant SBOMs (SPDX 2.3 & CycloneDX 1.5)
        run: |
          mkdir -p sbom
          chmod +x scripts/generate_sbom.sh
          ./scripts/generate_sbom.sh sbom

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulcan-sbom-artifacts
          path: sbom/
          retention-days: 14

      - name: Run Trivy Filesystem Vulnerability & Secret Scan
        run: |
          echo "─── Scanning Repository & Dependencies with Trivy ───"
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format table --skip-dirs backend/ansible/keys,deploy/sandbox/keys,evals --skip-files scripts/build_golden_scenarios.py .
          # Enforce fail-closed on exploitable CRITICAL vulnerabilities in repository packages
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs backend/ansible/keys,deploy/sandbox/keys,evals --skip-files scripts/build_golden_scenarios.py .

      - name: Build & Scan Deployable Backend Container Image (INFRA-30)
        run: |
          echo "─── Building Backend Container Image (deploy-backend surface) ───"
          docker build -t vulcan-backend:ci -f backend/Dockerfile backend/
          echo "─── Scanning Backend Container Image with Trivy ───"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table vulcan-backend:ci
          # Enforce fail-closed on exploitable CRITICAL vulnerabilities in backend image
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 vulcan-backend:ci

      - name: Build & Scan Deployable Frontend Container Image (INFRA-30)
        run: |
          echo "─── Building Frontend Container Image (deploy-frontend surface) ───"
          docker build -t vulcan-frontend:ci -f frontend/Dockerfile frontend/
          echo "─── Scanning Frontend Container Image with Trivy ───"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table vulcan-frontend:ci
          # Enforce fail-closed on exploitable CRITICAL vulnerabilities in frontend image
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 vulcan-frontend:ci

      - name: Scan Infrastructure Baseline Images (INFRA-30 Inventory)
        run: |
          echo "─── Scanning Infrastructure Baseline Images (Inventory Tracking) ───"
          for img in redis:7.2-alpine pgvector/pgvector:pg16 minio/minio:RELEASE.2025-09-07T16-13-09Z; do
            echo "Scanning $img..."
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table $img || true
          done

      - name: Generate Trivy SARIF Report for GitHub Security
        if: always()
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --format sarif -o trivy-results.sarif --skip-dirs backend/ansible/keys,deploy/sandbox/keys,evals --skip-files scripts/build_golden_scenarios.py . || true

      - name: Upload Trivy Vulnerability Scan Results (SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vuln-results
          path: trivy-results.sarif
          retention-days: 14

