name: Continuous Deployment to Ubuntu Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: vulcan-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deploy to remote Ubuntu server via SSH
  deploy:
    name: Deploy to Remote Ubuntu Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.ORACLEUBUNTU }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            set -e
            APP_DIR="$HOME/vulcan"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning Vulcan repository..."
              git clone https://github.com/lavkushry/vulcan.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-server.sh
            ./scripts/deploy-server.sh
