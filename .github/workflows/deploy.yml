name: Continuous Deployment to Ubuntu Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: vulcan-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Verify Reality Invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vulcan_control_plane
          POSTGRES_USER: vulcan_admin
          POSTGRES_PASSWORD: vulcan_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulcan_admin -d vulcan_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt psycopg[binary]

      - name: Apply Database Migrations (Fresh PostgreSQL Schema Gate)
        env:
          DATABASE_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
        run: |
          python scripts/run_migrations.py --db-url "$DATABASE_URL"

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PyTest Test Matrix (Auth-Enabled + Postgres Contract Tests)
        env:
          VULCAN_AUTH_DISABLED: "0"
          VULCAN_API_TOKENS: '{"vlc_test_alice": "eng.alice", "vlc_test_bob": "lead.bob", "vlc_test_admin": "admin.dave", "vlc_test_sec": "sec.carol", "vlc_test_charlie": "operator.charlie"}'
          NEXT_PUBLIC_VULCAN_API_TOKEN: "vlc_test_alice"
          DATABASE_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
          POSTGRES_URL: "postgresql://vulcan_admin:vulcan_ci_secret@localhost:5432/vulcan_control_plane"
        run: |
          cd backend && python -m pytest tests -q

      - name: Verify Architecture Reality Matrix Probes (Hermetic Mode, Auth-Enabled)
        env:
          VULCAN_AUTH_DISABLED: "0"
          VULCAN_API_TOKENS: '{"vlc_test_alice": "eng.alice", "vlc_test_bob": "lead.bob", "vlc_test_admin": "admin.dave", "vlc_test_sec": "sec.carol", "vlc_test_charlie": "operator.charlie"}'
          NEXT_PUBLIC_VULCAN_API_TOKEN: "vlc_test_alice"
        run: |
          python scripts/verify-matrix-claims.py --hermetic

  # Deploy to remote Ubuntu server via SSH (strictly gated by test job)
  deploy:
    name: Deploy to Remote Ubuntu Server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.ORACLEUBUNTU }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 300s
          script: |
            set -e
            APP_DIR="$HOME/vulcan"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning Vulcan repository..."
              git clone https://github.com/lavkushry/vulcan.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-server.sh
            ./scripts/deploy-server.sh
