---
- name: Linux Security Hardening, Audit & Patching Policy
  hosts: "{{ target_host | default('sandbox') }}"
  gather_facts: true
  become: true
  vars:
    ssh_port: "{{ port | default(22) | int }}"
    enable_automatic_updates: "{{ auto_updates | default(true) | bool }}"
    banner_message: "{{ legal_banner | default('AUTHORIZED ACCESS ONLY - Project Vulcan Governed System') }}"

  pre_tasks:
    - name: Sanitize dpkg statoverride and recover interrupted package states
      ansible.builtin.shell: |
        # Idempotently sanitize dpkg statoverride if invalid users or stale package entries exist
        if [ -f /var/lib/dpkg/statoverride ]; then
          grep -v "redis" /var/lib/dpkg/statoverride > /var/lib/dpkg/statoverride.clean 2>/dev/null && \
            cp /var/lib/dpkg/statoverride.clean /var/lib/dpkg/statoverride && \
            rm -f /var/lib/dpkg/statoverride.clean || true
        fi
        dpkg --configure -a || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

  tasks:
    - name: Install security packages
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
          - fail2ban
        state: present
        update_cache: yes
      # NOTE: ignore_errors is strictly permitted here only for ephemeral unprivileged sandbox
      # container targets where systemd/sysvinit service starts are restricted. Must NEVER
      # be migrated to bare-metal or production VMs without strict error enforcement.
      ignore_errors: true

    - name: Configure legal SSH pre-login warning banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: |
          ********************************************************************
          * WARNING: {{ banner_message }}
          * All activities are monitored, logged, and cryptographically signed.
          ********************************************************************
        mode: '0644'

    - name: Ensure SSH uses legal banner
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Banner'
        line: "Banner /etc/issue.net"

    - name: Disable insecure SSH X11 forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: "X11Forwarding no"

    - name: Configure SSH max authentication attempts
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: "MaxAuthTries 4"

    - name: Hardening Audit Summary
      ansible.builtin.debug:
        msg:
          - "System Hardening applied successfully!"
          - "SSH MaxAuthTries: 4"
          - "Banner: Active"
          - "Target Host: {{ inventory_hostname }}"
